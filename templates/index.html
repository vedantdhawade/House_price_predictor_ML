<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>House Price Predictor</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: linear-gradient(to right, #ffe259, #ffa751);
        min-height: 100vh;
        font-family: "Segoe UI", sans-serif;
      }
      .card {
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 12px 25px rgba(0, 0, 0, 0.2);
        background: linear-gradient(to right, #6a11cb, #2575fc);
        color: white;
      }
      .card h2 {
        font-weight: bold;
        margin-bottom: 30px;
      }
      .form-control,
      .form-select {
        border-radius: 10px;
        border: none;
        padding: 10px 15px;
        font-size: 1rem;
      }
      .btn-custom {
        background: #ff6a00;
        border: none;
        border-radius: 10px;
        font-weight: bold;
        transition: 0.3s;
      }
      .btn-custom:hover {
        background: #ff4500;
        color: white;
      }
      #result {
        background: rgba(255, 255, 255, 0.2);
        padding: 15px;
        border-radius: 12px;
        margin-top: 20px;
        font-weight: bold;
      }
      @media (max-width: 576px) {
        .card {
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8 col-sm-12">
          <div class="card">
            <h2 class="text-center">
              <i class="bi bi-house-door-fill"></i> House Price Predictor
            </h2>
            <form id="priceForm">
              <div class="mb-3">
                <label for="total_sqft" class="form-label"
                  >Total Square Feet</label
                >
                <input
                  type="number"
                  class="form-control"
                  id="total_sqft"
                  name="total_sqft"
                  placeholder="Enter total sqft"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="bath" class="form-label">Number of Bathrooms</label>
                <input
                  type="number"
                  class="form-control"
                  id="bath"
                  name="bath"
                  placeholder="Enter number of bathrooms"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="bedroom" class="form-label"
                  >Number of Bedrooms</label
                >
                <input
                  type="number"
                  class="form-control"
                  id="bedroom"
                  name="bedroom"
                  placeholder="Enter number of bedrooms"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="location" class="form-label">Location</label>
                <select
                  class="form-select"
                  id="location"
                  name="location"
                  required
                >
                  {% for location in locations %}
                  <option value="{{location}}">{{location}}</option>
                  {% endfor %}
                </select>
              </div>
              <div class="d-grid">
                <button type="submit" class="btn btn-custom btn-lg">
                  Predict Price
                </button>
              </div>
            </form>

            <div id="result" class="text-center fs-4"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      document
        .getElementById("priceForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          let formData = new FormData(this);

          document.getElementById("result").innerHTML = "⏳ Predicting...";

          fetch("/predict", {
            method: "POST",
            body: formData,
          })
            .then((res) => res.json())
            .then((data) => {
              if (data.status === "ok") {
                document.getElementById("result").innerHTML =
                  "Predicted Price: <b>" + data.prediction + " Lakhs</b>";
              } else {
                document.getElementById("result").innerHTML =
                  "⚠️ Error: " + data.message;
              }
            })
            .catch((err) => {
              document.getElementById("result").innerHTML =
                "❌ Request failed: " + err;
            });
        });
    </script>
  </body>
</html>
